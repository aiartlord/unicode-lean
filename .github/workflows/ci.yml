name: ci

# Tier 1 (fast pre-check). Runs on every push and PR.
# Branch protection on `main` should require:
#   ci / hardening
#   ci / runtime package
#   ci / build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening:
    # Source-level guards. No Lean build required; runs in seconds and
    # catches the common tampering patterns before the slower jobs.
    name: hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: proof-placeholder guard
        run: bash scripts/check-sorry.sh

      - name: trusted-boundary guard
        run: bash scripts/check-no-axiom.sh

      - name: runtime import boundary
        run: bash scripts/check-runtime-import-boundary.sh

      - name: Lean cache plan fixtures
        run: scripts/check-lean-cache-plan-fixtures.py

      - name: Lean cache runner selftest
        run: scripts/check-lean-cache-runner-selftest.py

      - name: Lean cache runbook commands
        run: scripts/check-lean-cache-runbook.py

      - name: shared runtime policy contract
        run: bash scripts/check-policy-contract.sh

      - name: runtime ports are self-contained
        run: bash scripts/check-port-self-contained.sh

      - name: every .lean file is transitively imported from an audited root
        run: bash scripts/check-orphan-files.sh

      - name: UCD source files match pinned SHA-256
        run: bash scripts/check-ucd-hashes.sh

      - name: every Security detector has a paired *Test.lean harness
        run: bash scripts/check-security-coverage.sh

      - name: Security fixtures match pinned SHA-256
        run: bash scripts/check-security-hashes.sh

      - name: BIP-39 wordlists match pinned SHA-256
        run: bash scripts/check-bip39-hashes.sh

      - name: curated baseline tables match pinned SHA-256
        run: bash scripts/check-curated-hashes.sh

  runtime-package:
    # Runtime packaging is a product/deployment gate. It uses the runtime-only
    # Nix shell and must not enter the Lean dev shell or build theorem roots.
    #
    # This job is a READ-ONLY consumer of a private nix binary cache. All cache
    # identifiers (substituter URL, signing public keys) and the read-only
    # object-read credential live in repository *secrets*, never in this file —
    # so the public workflow reveals no infra topology. The signing key never
    # touches CI (artifacts are signed and pushed from private infra), and
    # `extra-trusted-public-keys` makes nix accept a substituted path only under
    # a valid signature and fail closed otherwise; store paths are
    # input-addressed, so the cache only accelerates the reproducible-from-source
    # build. Fork PRs receive no secrets (pull_request, not pull_request_target),
    # so the substituter is simply skipped there and the raised timeout absorbs a
    # cold rebuild.
    #
    # Secrets to set (values only ever on the GitHub side):
    #   NIX_EXTRA_SUBSTITUTERS      the nix substituter URL (bucket + endpoint)
    #   NIX_TRUSTED_PUBLIC_KEYS     space-separated cache public keys
    #   R2_READONLY_ACCESS_KEY_ID   object-read-only token id
    #   R2_READONLY_SECRET_ACCESS_KEY  object-read-only token secret
    name: runtime package
    runs-on: ubuntu-latest
    needs: hardening
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: configure read-only cache credentials
        env:
          CACHE_KEY_ID: ${{ secrets.R2_READONLY_ACCESS_KEY_ID }}
          CACHE_KEY_SECRET: ${{ secrets.R2_READONLY_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CACHE_KEY_ID" ]; then
            sudo mkdir -p /root/.aws
            printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
              "$CACHE_KEY_ID" "$CACHE_KEY_SECRET" \
              | sudo tee /root/.aws/credentials >/dev/null
          else
            echo "notice: read-only cache token unset — substituter will be a cache miss"
          fi

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ secrets.NIX_EXTRA_SUBSTITUTERS }}
            extra-trusted-public-keys = ${{ secrets.NIX_TRUSTED_PUBLIC_KEYS }}

      - name: runtime release preflight
        run: |
          timeout 4800s nix develop .#runtime -c env \
            JOBS=1 \
            UNICODE_RUNTIME_DIST=/tmp/unicode-runtime-package-ci \
            scripts/check-release-runtime-preflight.sh \
              --dist-dir /tmp/unicode-runtime-package-ci

  build:
    # Lake build via the canonical Lean action. Toolchain version comes
    # from the `lean-toolchain` file; the action handles install, cache,
    # and lake fetch.
    name: build
    runs-on: ubuntu-latest
    needs: hardening
    # Re-derives the whole Lean canon from source via lake — recompiling every
    # olean and re-checking every proof in the kernel (the reproducible-from-
    # source backstop; deliberately not substituted) — then replays the built
    # artifacts through the independent lean4checker binary. Long from a cold
    # runner, so give it headroom rather than let the runner kill it mid-proof.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # Build via lake; toolchain auto-detected from `lean-toolchain`.
          build-args: ""

      - name: add swap headroom
        run: |
          # The headline modules' decide+kernel closures are each memory-safe
          # cold, but lake fans several across all runner cores at once and
          # their combined peak exceeds the hosted runner's ~16 GB RAM — the
          # runner is then reclaimed mid-proof (exit 143 / "shutdown signal").
          # Lake 5.0 has no --jobs flag to cap concurrency, so give the build
          # virtual-memory headroom on the large /mnt volume instead; the
          # 180-minute timeout absorbs any swap slowdown.
          sudo fallocate -l 24G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -h

      - name: smoke-check headline theorems
        run: |
          # Targeted rebuild of the load-bearing top-level modules. If
          # any of these names is renamed without updating CI, the
          # smoke check catches it before merge.
          lake build \
            Unicode.Normalization.QuickCheckSoundnessTheorem \
            Unicode.Precis.Preparation \
            Unicode.Bidi.Algorithm \
            Unicode.Confusables

      - name: axiom footprint of the audited root
        run: |
          # Walks every declaration in the built `Unicode` modules and
          # verifies its transitive axiom footprint is contained in the
          # three Lean-core axioms. Catches sorryAx, Lean.ofReduceBool,
          # Lean.trustCompiler, and project-local axioms at the artifact
          # level, past anything a source text scan can see.
          bash scripts/check-axiom-footprint.sh

      - name: independent kernel re-check of the built artifacts
        run: |
          # Builds the commit-pinned lean4checker under the repository
          # toolchain and replays every module's declarations through the
          # Lean kernel — an independent binary confirming the .olean
          # artifacts contain only kernel-accepted proofs.
          bash scripts/check-olean-recheck.sh
