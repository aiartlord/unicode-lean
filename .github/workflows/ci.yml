name: ci

# Tier 1 (fast pre-check). Runs on every push and PR.
# Branch protection on `main` should require:
#   ci / hardening
#   ci / runtime package
#   ci / build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening:
    # Source-level guards. No Lean build required; runs in seconds and
    # catches the common tampering patterns before the slower jobs.
    name: hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: proof-placeholder guard
        run: bash scripts/check-sorry.sh

      - name: trusted-boundary guard
        run: bash scripts/check-no-axiom.sh

      - name: runtime import boundary
        run: bash scripts/check-runtime-import-boundary.sh

      - name: Lean cache plan fixtures
        run: scripts/check-lean-cache-plan-fixtures.py

      - name: Lean cache runner selftest
        run: scripts/check-lean-cache-runner-selftest.py

      - name: Lean cache runbook commands
        run: scripts/check-lean-cache-runbook.py

      - name: shared runtime policy contract
        run: bash scripts/check-policy-contract.sh

      - name: runtime ports are self-contained
        run: bash scripts/check-port-self-contained.sh

      - name: every .lean file is transitively imported from an audited root
        run: bash scripts/check-orphan-files.sh

      - name: UCD source files match pinned SHA-256
        run: bash scripts/check-ucd-hashes.sh

      - name: every Security detector has a paired *Test.lean harness
        run: bash scripts/check-security-coverage.sh

      - name: Security fixtures match pinned SHA-256
        run: bash scripts/check-security-hashes.sh

      - name: BIP-39 wordlists match pinned SHA-256
        run: bash scripts/check-bip39-hashes.sh

      - name: curated baseline tables match pinned SHA-256
        run: bash scripts/check-curated-hashes.sh

  runtime-package:
    # Runtime packaging is a product/deployment gate. It uses the runtime-only
    # Nix shell and must not enter the Lean dev shell or build theorem roots.
    name: runtime package
    runs-on: ubuntu-latest
    needs: hardening
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: runtime release preflight
        run: |
          timeout 1200s nix develop .#runtime -c env \
            JOBS=1 \
            UNICODE_RUNTIME_DIST=/tmp/unicode-runtime-package-ci \
            scripts/check-release-runtime-preflight.sh \
              --dist-dir /tmp/unicode-runtime-package-ci

  build:
    # Lake build via the canonical Lean action. Toolchain version comes
    # from the `lean-toolchain` file; the action handles install, cache,
    # and lake fetch.
    name: build
    runs-on: ubuntu-latest
    needs: hardening
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # Build via lake; toolchain auto-detected from `lean-toolchain`.
          build-args: ""

      - name: smoke-check headline theorems
        run: |
          # Targeted rebuild of the load-bearing top-level modules. If
          # any of these names is renamed without updating CI, the
          # smoke check catches it before merge.
          lake build Unicode.Normalization.QuickCheckSoundnessTheorem
          lake build Unicode.Precis.Preparation
          lake build Unicode.Bidi.Algorithm
          lake build Unicode.Confusables
