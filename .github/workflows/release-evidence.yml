name: release-evidence

# Builds auditable release evidence for version tags. This workflow
# publishes source evidence artifacts to the matching GitHub Release
# and attaches GitHub artifact attestations.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  evidence:
    name: release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: validate version tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*)
              ;;
            *)
              echo "FATAL: release evidence may only publish for version tags matching v*."
              exit 1
              ;;
          esac

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          # Toolchain + lake setup only; the full-closure build is explicit below.
          build: false
          test: false
          lint: false

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: hardening checks
        run: |
          bash scripts/check-sorry.sh
          bash scripts/check-no-axiom.sh
          bash scripts/check-runtime-import-boundary.sh
          scripts/check-lean-cache-plan-fixtures.py
          scripts/check-lean-cache-runner-selftest.py
          scripts/check-lean-cache-runbook.py
          bash scripts/check-policy-contract.sh
          bash scripts/check-port-self-contained.sh
          bash scripts/check-orphan-files.sh
          bash scripts/check-ucd-hashes.sh
          bash scripts/check-ucd-upstream.sh
          bash scripts/check-security-coverage.sh
          bash scripts/check-security-hashes.sh
          bash scripts/check-bip39-hashes.sh
          bash scripts/check-curated-hashes.sh
          bash scripts/check-actions-pinned.sh

      - name: reclaim disk headroom
        run: |
          # Reclaim the runner's preinstalled toolchains (the nix shell uses none
          # of them) BEFORE allocating swap and copying the nix closure. Without
          # this the root disk can exhaust while the closure is fetched, and the
          # runner crashes with "No space left on device" before the build runs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: add swap headroom
        run: |
          # The full closure's decide+kernel proofs fan across all runner cores
          # and their combined peak exceeds the hosted runner's ~16 GB RAM. Lake
          # 5.0 has no --jobs flag to cap concurrency, so give the build
          # virtual-memory headroom on the large /mnt volume instead.
          sudo fallocate -l 24G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -h

      - name: build the full audited closure
        run: lake build UnicodeFullConformance UnicodeSecurity UnicodeAssurance

      - name: artifact-level assurance over the full closure
        run: |
          # Both gates import the runtime root, the 27 detector families, the
          # conformance harnesses and the assurance layer, so they run only after
          # the closure above is built. The axiom footprint of every declaration
          # must stay within propext, Quot.sound and Classical.choice; the
          # independent leanchecker replays every built olean through the kernel.
          bash scripts/check-axiom-footprint.sh
          bash scripts/check-olean-recheck.sh

      - name: smoke-check headline theorems
        run: |
          lake build Unicode.Normalization.QuickCheckSoundnessTheorem
          lake build Unicode.Precis.Preparation
          lake build Unicode.Bidi.Algorithm
          lake build Unicode.Confusables

      - name: recorded security verdicts are the Lean verdicts
        run: bash scripts/check-lean-replay.sh

      - name: full official conformance evidence
        run: lake build UnicodeFullConformance

      - name: free disk space
        run: |
          # The runtime package smoke cold-copies the nix closure when the
          # private cache is unavailable; reclaim the runner's preinstalled
          # toolchains, which the nix shell does not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: runtime package smoke evidence
        run: |
          timeout 1200s nix develop .#runtime -c env \
            JOBS=1 \
            UNICODE_RUNTIME_DIST=/tmp/unicode-runtime-package-release \
            scripts/check-release-runtime-preflight.sh \
              --dist-dir /tmp/unicode-runtime-package-release

      - name: pinned conformance inputs manifest
        run: |
          bash scripts/check-conformance-inputs.sh
          mkdir -p dist
          cp fixtures/conformance/CONFORMANCE-INPUTS.sha256 dist/CONFORMANCE-INPUTS.sha256

      - name: bundle runtime package evidence
        run: |
          mkdir -p dist
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C /tmp \
            -czf "dist/unicode-runtime-${GITHUB_REF_NAME}.tar.gz" \
            unicode-runtime-package-release

      - name: generate release evidence
        run: bash scripts/release-evidence.sh "${GITHUB_REF_NAME}" dist

      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Automated release evidence for ${GITHUB_REF_NAME}."
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      - name: upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: dist/
          retention-days: 90

      - name: attest release evidence
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.source.tar.gz
            dist/unicode-runtime-*.tar.gz
            dist/*.sbom.cdx.json
            dist/SHA256SUMS
